name: Release (Linux)

on:
  push:
    tags:
      - "v*-linux"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: StarTracker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: StarTracker/package-lock.json

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          TAG="${TAG%-linux}"
          npm version "$TAG" --no-git-tag-version --allow-same-version

      - name: Read package version
        id: version
        shell: bash
        working-directory: StarTracker
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Block committed installers in git
        run: node StarTracker/scripts/verify-repo-hygiene.js

      - name: Install dependencies
        run: npm ci

      - name: Build Linux AppImage
        run: npm run dist:linux

      - name: Verify AppImage matches tag version
        run: node scripts/verify-release-assets.js ${{ steps.version.outputs.version }} linux

      - name: Locate Linux AppImage
        id: linux_artifact
        shell: bash
        run: |
          shopt -s nullglob
          files=(StarTracker-*.AppImage dist/StarTracker-*.AppImage)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No AppImage found under $(pwd):"
            find . -maxdepth 3 -type f \( -name '*.AppImage' -o -name '*.deb' \) || true
            exit 1
          fi
          echo "path=StarTracker/${files[0]}" >> "$GITHUB_OUTPUT"
          echo "Using StarTracker/${files[0]}"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: ${{ steps.linux_artifact.outputs.path }}
          if-no-files-found: error

  release:
    needs: build-linux
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: release-assets

      - name: Reject Windows assets in upload
        shell: bash
        run: |
          shopt -s nullglob
          bad=(release-assets/*.exe)
          if [ ${#bad[@]} -gt 0 ]; then
            echo "Windows installers must not ship on Linux release:"
            printf '  %s\n' "${bad[@]}"
            exit 1
          fi
          imgs=(release-assets/*.AppImage)
          if [ ${#imgs[@]} -lt 1 ]; then
            echo "No AppImage to publish"
            ls -la release-assets || true
            exit 1
          fi
          echo "Publishing: ${imgs[*]}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: StarTracker ${{ github.ref_name }} (Linux)
          body: |
            ## Linux install

            Download **StarTracker-*-x86_64.AppImage**, `chmod +x`, run it.

            Do **not** use **Source code (zip)**. Linux builds are only on `v*-linux` releases.
          files: release-assets/*
          generate_release_notes: false
          allowUpdates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
