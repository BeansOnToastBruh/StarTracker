name: Release (Windows)

on:
  push:
    tags:
      - "v*"
      - "!v*-linux"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    if: ${{ !endsWith(github.ref_name, '-linux') }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: StarTracker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: StarTracker/package-lock.json

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          TAG="${TAG%-linux}"
          npm version "$TAG" --no-git-tag-version --allow-same-version

      - name: Read package version
        id: version
        shell: bash
        working-directory: StarTracker
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Block committed installers in git
        run: node scripts/verify-repo-hygiene.js

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installers
        run: npm run dist:win

      - name: Verify installers match tag version
        run: node scripts/verify-release-assets.js ${{ steps.version.outputs.version }} windows

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            StarTracker/StarTracker-${{ steps.version.outputs.version }}-x64.exe
            StarTracker/StarTracker-${{ steps.version.outputs.version }}-portable.exe
            StarTracker/dist/StarTracker-${{ steps.version.outputs.version }}-x64.exe
            StarTracker/dist/StarTracker-${{ steps.version.outputs.version }}-portable.exe
          if-no-files-found: error

  release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/') && !endsWith(github.ref_name, '-linux')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release-assets

      - name: Reject non-Windows assets in upload
        shell: bash
        run: |
          shopt -s nullglob
          bad=(release-assets/*.AppImage release-assets/*.deb)
          if [ ${#bad[@]} -gt 0 ]; then
            echo "Linux artifacts must not ship on Windows release:"
            printf '  %s\n' "${bad[@]}"
            exit 1
          fi
          exes=(release-assets/*.exe)
          if [ ${#exes[@]} -lt 1 ]; then
            echo "No .exe files to publish"
            ls -la release-assets || true
            exit 1
          fi
          echo "Publishing: ${exes[*]}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: StarTracker ${{ github.ref_name }} (Windows)
          body: |
            ## Windows install

            - **StarTracker-*-x64.exe** — installer (recommended)
            - **StarTracker-*-portable.exe** — portable, no install
          files: release-assets/*
          generate_release_notes: false
          allowUpdates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
